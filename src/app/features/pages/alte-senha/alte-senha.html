<div class="change-password-container">
  <div class="form-box">
    
    <div class="header-form">
      <img src="assets/png/logoBg-main.png" alt="Project-Éden Logo" class="logo">
      <h2>Alterar sua senha</h2>
      <p class="subtitle">Escolha uma senha forte para garantir a segurança da sua conta.</p>
      <span class="alert">Enviamos o código de segurança para o seu e-mail. Caso tenha problemas, entre em contato com o suporte nesse email: <b>support@projecteden.com</b></span>
    </div>

    <form class="password-form" [formGroup]="passwordForm" (ngSubmit)="submit()">
        
        <div class="input-group">
            <label for="code">Código de segurança</label>
            <div class="input-wrapper">
            <input 
                type="text" 
                id="code" 
                formControlName="code"
                placeholder="Digite seu código de segurança"
                maxlength="6"
                required>
            <div class="icon-container">
                <span class="icon-lock">🔒</span> 
            </div>
            </div>
        </div>

        <div class="input-group">
            <label for="newPassword">Nova Senha</label>
            <div class="input-wrapper">
            <input 
                type="password" 
                id="newPassword" 
                formControlName="newPassword"
                placeholder="Crie uma nova senha forte"
                required>
            <div class="icon-container">
                <span class="icon-lock">🔒</span>
            </div>
            </div>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirmar Nova Senha</label>
            <div class="input-wrapper">
            <input 
                type="password" 
                id="confirmPassword" 
                formControlName="confirmPassword"
                placeholder="Confirme sua nova senha"
                required>
            <div class="icon-container">
                <span class="icon-lock">🔒</span>
            </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit" [disabled]="passwordForm.invalid">Salvar Nova Senha</button>
            <button type="button" class="btn-cancel" routerLink="/login">Cancelar</button>
        </div>

    </form>

  </div>
</div>
