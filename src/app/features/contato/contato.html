<app-layout-main-interface>
    <form class="main">
        <app-card>
            <form class="card-suggestion">
                <h3>Entre em Contato</h3>
                <p>Tem dúvidas ou sugestões sobre o PROJECT-EDEN? Envie sua mensagem abaixo.</p>
                <p>Você já está autenticado como <strong>{{username}}</strong>.</p>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" [(ngModel)]="message" name="mensagem" placeholder="Escreva sua mensagem..."></textarea>

                <button type="submit" (click)="SetMessageSuggestions()">Enviar Mensagem</button>
            </form>
        </app-card>
        <app-card>
            <form class="card-contact">
                <h3>Outros canais</h3>
                <p>Se preferir, contate a equipe de suporte diretamente através dos canais oficiais:</p>
                <p><strong>Email:</strong> <button class="spoiler">contato@projecteden.com</button></p>
                <p><strong>Telefone:</strong> <button class="spoiler">(11) 99999-9999</button></p>
            </form>
        </app-card>
    </form>
</app-layout-main-interface>
